name: Research code checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMBA_NUM_THREADS: 2
      HF_HUB_DISABLE_IMPLICIT_TOKEN: 1
      HF_HUB_OFFLINE: 1
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Dataset integrity and acoustic classifiers
        run: python -m pytest -q tools/tests Acoustic-GTR/tests
      - name: Optional HuBERT path using local tiny fixtures
        run: python -m pytest -q HuBERT-GTR/tests
      - name: FastPitch optimizer, resume and strict inference
        run: python -m pytest -q FastPitch-GTR/tests
      - name: StyleTTS conditioning and pipeline
        run: python -m pytest -q StyleTTS-GTR/tests
      - name: Anonymous listening statistics
        run: python -m unittest discover -s evaluation/tests -p 'test_*.py' -v
