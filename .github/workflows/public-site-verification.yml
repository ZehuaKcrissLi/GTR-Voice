name: Public site browser verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Playwright dependencies for system Chrome
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install-deps chromium
      - name: Verify public media, real timeline drag and complete original ZIP
        run: python -B tools/verify_public_site.py
