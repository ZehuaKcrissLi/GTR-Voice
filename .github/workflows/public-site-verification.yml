name: Public site browser verification

on:
  workflow_dispatch:
    inputs:
      media_only:
        description: Skip ZIP transfer; verify public media only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Playwright for preinstalled system Chrome
        run: |
          python -m pip install playwright==1.64.1
      - name: Verify public media and optionally complete original ZIP
        env:
          MEDIA_ONLY: ${{ inputs.media_only }}
        run: |
          if [ "$MEDIA_ONLY" = "true" ]; then
            python -B tools/verify_public_site.py --media-only
          else
            python -B tools/verify_public_site.py
          fi
